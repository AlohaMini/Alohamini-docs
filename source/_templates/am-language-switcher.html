<a class="am-language-switcher" href="{{ am_other_language_url }}" data-am-anchors='{{ am_anchor_map | tojson }}' hreflang="{{ 'zh-CN' if am_english else 'en' }}" lang="{{ 'zh-CN' if am_english else 'en' }}" aria-label="{{ 'Switch to Simplified Chinese' if am_english else '切换到英文' }}" title="{{ am_language_label }}">
  <i class="fa-solid fa-language" aria-hidden="true"></i><span>{{ am_other_language }}</span>
</a>
